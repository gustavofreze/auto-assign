[tool.poetry]
name = "auto-assign"
readme = "README.md"
license = "MIT"
version = "0.1.0"
keywords = ["auto-assign", "issues", "pull-requests", "github", "action"]
description = "GitHub action that automatically assigns issues and pull requests to specified assignees."
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
PyGithub = "^2.10"
dependency-injector = "^4.49.1"

[tool.poetry.group.dev.dependencies]
mypy = "^2.4"
pylint = "^4.1.3"
pytest = "^9.1.1"
coverage = "^7.17.0"

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
# The driven adapter tests hand a duck-typed RepositorySpy where PyGithub annotates its concrete Repository.
module = ["tests.driven.github.*"]
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[build-system]
requires = ["poetry-core>=2.5"]
build-backend = "poetry.core.masonry.api"
